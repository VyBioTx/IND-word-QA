[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.14.5,<3.15"
nodejs = ">=26.3.0,<26.4"

[pypi-dependencies]
fastapi = ">=0.136.3,<0.137"
uvicorn = { version = ">=0.48.0,<0.49", extras = ["standard"] }
sqlmodel = ">=0.0.38,<0.0.39"
python-multipart = ">=0.0.30,<0.0.31"
python-docx = ">=1.2.0,<2"
lxml = ">=6.1.1,<7"
openpyxl = ">=3.1.5,<4"

[tasks]
backend = "cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8011 --reload"
frontend = "cd frontend && npm run dev"
"frontend:build" = "cd frontend && npm run build"
"frontend:preview" = "cd frontend && npm run preview"
"frontend:install" = "cd frontend && npm install"
"check:ports" = "node scripts/check-local.mjs ports"
"check:health" = "node scripts/check-local.mjs health"
"test:smoke" = "node scripts/smoke-test.mjs"
"clear:test-data" = "python scripts/clear-local-data.py --yes"

[feature.dev.pypi-dependencies]
pytest = ">=9.0.3,<10"
httpx = ">=0.28.1,<0.29"

[feature.dev.tasks]
test = "cd backend && python -m pytest"
"generate:fixtures" = "cd backend && python app/tests/fixtures/generate_sample_docx.py"

[environments]
dev = ["dev"]
