[project]
authors = [{name = "DeepSeek-Coding", email = "agent@multica.ai"}]
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "sqlmodel>=0.0.22", "python-multipart>=0.0.9", "python-docx>=1.1.2", "lxml>=5.2.0", "openpyxl>=3.1.5", "pytest>=8.2.0", "httpx>=0.27.0"]
name = "backend"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
backend = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest -v --tb=short app/tests/"
test-tfx06 = "pytest -v app/tests/test_comprehensive_tfx06_report.py -s --tb=short"
test-acceptance = "pytest -v app/tests/test_acceptance_sample_docx.py -s --tb=short"
test-all = "pytest -v --tb=short app/tests/"

[tool.pixi.dependencies]
python = ">=3.11,<3.12"
